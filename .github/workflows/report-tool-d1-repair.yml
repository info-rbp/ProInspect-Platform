name: Report Tool D1 repair

on:
  push:
    branches:
      - release/cloudflare-platform
    paths:
      - .github/workflows/report-tool-d1-repair.yml
      - ops/report-tool-d1-repair-request.json

permissions:
  contents: read

concurrency:
  group: report-tool-d1-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
      REPORT_TOOL_SHA: 9616903d28247498224e3c2dd96404a8e42b5a1c
      REPORT_TOOL_DB_ID: 777186a0-e6ca-43f5-8f50-448bd4454046
    steps:
      - uses: actions/checkout@v4

      - name: Validate explicit repair request
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const req=JSON.parse(fs.readFileSync('ops/report-tool-d1-repair-request.json','utf8'));
          const sha=process.env.REPORT_TOOL_SHA;
          const db=process.env.REPORT_TOOL_DB_ID;
          if(req.schemaVersion!==1||req.action!=='apply')throw new Error('Invalid Report Tool D1 repair request.');
          if(req.reportToolSha!==sha||req.databaseId!==db)throw new Error('Report Tool repair target changed unexpectedly.');
          if(req.approve!=='REPORT-TOOL-D1-MIGRATE:'+sha)throw new Error('Explicit Report Tool D1 approval token missing.');
          console.log('Exact Report Tool D1 repair request validated.');
          NODE

      - name: Checkout exact Report Tool source
        uses: actions/checkout@v4
        with:
          repository: info-rbp/Property-Report-Tool
          ref: ${{ env.REPORT_TOOL_SHA }}
          path: report-tool
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact Report Tool source
        run: |
          test "$(git -C report-tool rev-parse HEAD)" = "$REPORT_TOOL_SHA"
          test -f report-tool/migrations/0001_initial.sql
          test -f report-tool/migrations/0002_workflow_platform.sql
          grep -q 'CREATE TABLE IF NOT EXISTS report_deliveries' report-tool/migrations/0002_workflow_platform.sql
          grep -q 'CREATE TABLE IF NOT EXISTS signature_requests' report-tool/migrations/0002_workflow_platform.sql
          grep -q 'CREATE TABLE IF NOT EXISTS signature_parties' report-tool/migrations/0002_workflow_platform.sql
          grep -q 'CREATE TABLE IF NOT EXISTS signature_fields' report-tool/migrations/0002_workflow_platform.sql

      - name: Capture pre-repair D1 time-travel bookmark
        run: |
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const db=process.env.REPORT_TOOL_DB_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db+'/time_travel/bookmark';
          const response=await fetch(url,{headers:{Authorization:'Bearer '+token}});
          const body=await response.json().catch(()=>({}));
          if(!response.ok||body.success===false)throw new Error('Unable to capture Report Tool D1 bookmark: '+JSON.stringify(body.errors||body));
          console.log('PRE_REPAIR_D1_BOOKMARK='+String(body.result?.bookmark||body.result||'unknown'));
          NODE

      - name: Apply canonical Report Tool D1 migrations
        working-directory: report-tool
        run: npx --yes wrangler@4.147.0 d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Verify workflow tables and migration ledger
        run: |
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const db=process.env.REPORT_TOOL_DB_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function query(sql){
            const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db+'/query';
            const response=await fetch(url,{
              method:'POST',
              headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({sql})
            });
            const body=await response.json().catch(()=>({}));
            if(!response.ok||body.success===false)throw new Error('D1 query failed: '+JSON.stringify(body.errors||body));
            const blocks=Array.isArray(body.result)?body.result:[body.result];
            return blocks.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          }
          const rows=await query("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name");
          const names=rows.map(x=>x.name);
          const required=['report_deliveries','signature_requests','signature_parties','signature_fields'];
          const missing=required.filter(x=>!names.includes(x));
          if(missing.length)throw new Error('Workflow tables still missing: '+missing.join(', '));
          const migrations=names.includes('d1_migrations')?await query('SELECT * FROM d1_migrations ORDER BY id'):[];
          console.log(JSON.stringify({requiredTables:'ready',migrations},null,2));
          NODE

      - name: Verify live public workflow health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl -fsS --max-time 15 https://proinspect.systems/api/public/workflow-health || true)"
            echo "Health response: ${body:-<empty>}"
            if printf '%s' "$body" | grep -q '"status":"ok"' &&
               printf '%s' "$body" | grep -q '"workflowSchema":"ready"'; then
              printf '%s' "$body" | grep -q '"resendConfigured":true"'
              printf '%s' "$body" | grep -q '"signingBaseConfigured":true"'
              printf '%s' "$body" | grep -q '"proinspectHandoffConfigured":true"'
              printf '%s' "$body" | grep -q '"proinspectIngestConfigured":true"'
              echo "Report Tool public workflow health is fully ready."
              exit 0
            fi
            sleep 5
          done
          echo "Report Tool workflow health did not become fully ready."
          exit 1
