name: Inspect Report Tool production bindings

on:
  push:
    branches:
      - release/cloudflare-platform
    paths:
      - .github/workflows/report-tool-binding-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live Worker binding metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/proinspect-property-report-creation-tool/settings"             > /tmp/settings.json
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/settings.json','utf8'));
          if(body.success===false)throw new Error(JSON.stringify(body.errors||[]));
          const bindings=(body.result?.bindings||[]).map(b=>({
            name:b.name,
            type:b.type,
            ...(b.type==='d1'?{id:b.id||b.database_id||null}:{}),
            ...(b.type==='r2_bucket'?{bucket_name:b.bucket_name||null}:{})
          }));
          console.log(JSON.stringify({bindings},null,2));
          const names=new Set(bindings.map(b=>b.name));
          for(const required of ['DB','REPORT_STORAGE'])if(!names.has(required))throw new Error('Missing required binding: '+required);
          NODE
