name: Sync Report Tool production integration secrets

on:
  push:
    branches:
      - release/cloudflare-platform
    paths:
      - .github/workflows/report-tool-secret-sync.yml

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
      GCP_PROJECT_ID: business-plan-applicatio-17047
    steps:
      - name: Check out pinned Report Tool source
        uses: actions/checkout@v4
        with:
          repository: info-rbp/Property-Report-Tool
          ref: 846f0e8e8a22c3de0ba462766b5d6839d4c7c9c9
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate Google Secret Manager source
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PRODUCTION_PROJECT_ID || 'business-plan-applicatio-17047' }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/696236368989/locations/global/workloadIdentityPools/proinspect-property-services/providers/github' }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT || 'proinspect-prod-terraform@business-plan-applicatio-17047.iam.gserviceaccount.com' }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3

      - name: Sync shared ProInspect integration secrets to Report Tool Worker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          REPORT_KEY="$(gcloud secrets versions access latest --secret=proinspect-production-report-handoff-signing-key --project="$GCP_PROJECT_ID")"
          REPORT_TOKEN="$(gcloud secrets versions access latest --secret=proinspect-production-report-ingest-token --project="$GCP_PROJECT_ID")"
          test -n "$REPORT_KEY"
          test -n "$REPORT_TOKEN"
          printf '%s' "$REPORT_KEY" | npx --yes wrangler@4.147.0 secret put PROINSPECT_HANDOFF_SIGNING_KEY --config wrangler.jsonc
          printf '%s' "$REPORT_TOKEN" | npx --yes wrangler@4.147.0 secret put PROINSPECT_INGEST_TOKEN --config wrangler.jsonc
          unset REPORT_KEY REPORT_TOKEN

      - name: Verify secret bindings exist without reading secret values
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/proinspect-property-report-creation-tool/settings"             > /tmp/settings.json
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/settings.json','utf8'));
          if(body.success===false)throw new Error(JSON.stringify(body.errors||[]));
          const bindings=body.result?.bindings||[];
          const names=new Set(bindings.map(b=>b.name));
          for(const required of ['PROINSPECT_HANDOFF_SIGNING_KEY','PROINSPECT_INGEST_TOKEN']){
            if(!names.has(required))throw new Error('Missing required Worker secret binding: '+required);
          }
          console.log('Required ProInspect Worker secret bindings are present.');
          NODE

      - name: Verify public signing health after secret sync
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl -sS --max-time 20 https://signing.proinspect.systems/api/public/workflow-health || true)"
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 https://signing.proinspect.systems/api/public/workflow-health || true)"
            if [ "$code" = "200" ] &&
               grep -q '"status":"ok"' /tmp/health.json &&
               grep -q '"workflowSchema":"ready"' /tmp/health.json &&
               grep -q '"proinspectHandoffConfigured":true' /tmp/health.json &&
               grep -q '"proinspectIngestConfigured":true' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health not ready yet: HTTP $code"
            sleep 10
          done
          cat /tmp/health.json || true
          exit 1
