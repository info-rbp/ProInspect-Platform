name: Stage 4 production cutover

on:
  push:
    branches: [main]
    paths: [ops/cloudflare-main-wif-bridge.json]

permissions:
  contents: read
  id-token: write

concurrency:
  group: proinspect-cloudflare-main-wif-bridge
  cancel-in-progress: false

jobs:
  bridge:
    name: Extend production WIF to Cloudflare main
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate one-purpose bridge request
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('ops/cloudflare-main-wif-bridge.json'))
          expected={'schemaVersion':1,'action':'cloudflare-main-wif','approve':'CLOUDFLARE-MAIN-WIF-V1'}
          if r != expected:
              raise SystemExit('Unexpected Cloudflare main WIF bridge request.')
          PY
      - name: Authenticate using existing reviewed Stage 4 federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PRODUCTION_PROJECT_ID || 'business-plan-applicatio-17047' }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/696236368989/locations/global/workloadIdentityPools/proinspect-property-services/providers/github' }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT || 'proinspect-prod-terraform@business-plan-applicatio-17047.iam.gserviceaccount.com' }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Extend reviewed provider condition to Cloudflare production on main
        run: |
          set -euo pipefail
          POOL="proinspect-property-services"
          PROVIDER="github"
          PROJECT="business-plan-applicatio-17047"
          OLD="attribute.repository_id == '1390107826' && attribute.repository_owner_id == '235419395' && attribute.repository == 'info-rbp/ProInspect-Platform' && ((google.subject == 'repo:info-rbp@235419395/ProInspect-Platform@1390107826:environment:production' && ((attribute.ref == 'refs/heads/release/platform-unification' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/stage4-production.yml@refs/heads/release/platform-unification') || (attribute.ref == 'refs/heads/main' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/stage4-production.yml@refs/heads/main') || (attribute.ref == 'refs/heads/release/cloudflare-platform' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/cloudflare-production.yml@refs/heads/release/cloudflare-platform'))) || (google.subject == 'repo:info-rbp@235419395/ProInspect-Platform@1390107826:environment:staging' && attribute.ref == 'refs/heads/release/cloudflare-platform' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/cloudflare-staging.yml@refs/heads/release/cloudflare-platform'))"
          NEW="attribute.repository_id == '1390107826' && attribute.repository_owner_id == '235419395' && attribute.repository == 'info-rbp/ProInspect-Platform' && ((google.subject == 'repo:info-rbp@235419395/ProInspect-Platform@1390107826:environment:production' && ((attribute.ref == 'refs/heads/release/platform-unification' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/stage4-production.yml@refs/heads/release/platform-unification') || (attribute.ref == 'refs/heads/main' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/stage4-production.yml@refs/heads/main') || (attribute.ref == 'refs/heads/release/cloudflare-platform' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/cloudflare-production.yml@refs/heads/release/cloudflare-platform') || (attribute.ref == 'refs/heads/main' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/cloudflare-production.yml@refs/heads/main'))) || (google.subject == 'repo:info-rbp@235419395/ProInspect-Platform@1390107826:environment:staging' && attribute.ref == 'refs/heads/release/cloudflare-platform' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/cloudflare-staging.yml@refs/heads/release/cloudflare-platform'))"
          CURRENT="$(gcloud iam workload-identity-pools providers describe "$PROVIDER" --project="$PROJECT" --location=global --workload-identity-pool="$POOL" --format='value(attributeCondition)')"
          if [ "$CURRENT" != "$OLD" ] && [ "$CURRENT" != "$NEW" ]; then
            echo "Current provider condition is outside the two reviewed states; refusing overwrite." >&2
            exit 1
          fi
          if [ "$CURRENT" != "$NEW" ]; then
            gcloud iam workload-identity-pools providers update-oidc "$PROVIDER" \
              --project="$PROJECT" \
              --location=global \
              --workload-identity-pool="$POOL" \
              --attribute-condition="$NEW" \
              --quiet
          fi
          VERIFIED="$(gcloud iam workload-identity-pools providers describe "$PROVIDER" --project="$PROJECT" --location=global --workload-identity-pool="$POOL" --format='value(attributeCondition)')"
          test "$VERIFIED" = "$NEW"
          echo "Cloudflare production workflow on main is now admitted by the reviewed WIF provider condition."
