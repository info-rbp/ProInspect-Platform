name: Zero Trust public signing paths

on:
  push:
    branches:
      - release/cloudflare-platform
    paths:
      - .github/workflows/zero-trust-public-signing.yml
      - scripts/cloudflare/zero-trust-public-signing.mjs
      - ops/zero-trust-public-signing-request.json

permissions:
  contents: read

concurrency:
  group: zero-trust-public-signing
  cancel-in-progress: false

jobs:
  discover:
    name: Discover Access state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only Zero Trust discovery
        run: node scripts/cloudflare/zero-trust-public-signing.mjs plan

  reconcile:
    name: Reconcile public signing Access paths
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate explicit owner-authorized Access request
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const req=JSON.parse(fs.readFileSync('ops/zero-trust-public-signing-request.json','utf8'));
          const expected=[
            'proinspect.systems/sign/*',
            'proinspect.systems/api/public/signing/*',
            'proinspect.systems/api/public/workflow-health'
          ];
          if(req.schemaVersion!==1||req.action!=='apply')throw new Error('Invalid Zero Trust request.');
          if(req.approve!=='ZERO-TRUST-PUBLIC-SIGNING:proinspect.systems')throw new Error('Explicit Zero Trust approval token missing.');
          if(JSON.stringify(req.paths)!==JSON.stringify(expected))throw new Error('Approved Zero Trust path set changed unexpectedly.');
          console.log('Explicit exact-path Zero Trust request validated.');
          NODE
      - name: Apply exact-path Access bypass applications
        run: node scripts/cloudflare/zero-trust-public-signing.mjs apply
