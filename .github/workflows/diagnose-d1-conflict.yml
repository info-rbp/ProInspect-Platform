name: Diagnose production D1 migration conflict

on:
  push:
    branches:
      - release/cloudflare-platform
    paths:
      - .github/workflows/diagnose-d1-conflict.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only destination diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto=await import('node:crypto');
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const list=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database?name='+encodeURIComponent('proinspect-platform-production')+'&per_page=100',{headers:{Authorization:'Bearer '+token}});
          const listed=await list.json();
          if(!list.ok||listed.success===false)throw new Error(JSON.stringify(listed.errors||[]));
          const exact=(listed.result||[]).filter(x=>x.name==='proinspect-platform-production');
          if(exact.length!==1)throw new Error('Expected exactly one production D1 database.');
          const db=exact[0].uuid;
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db+'/query';
          async function query(sql,params=[]){
            const r=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});
            const j=await r.json();
            if(!r.ok||j.success===false)throw new Error(JSON.stringify(j.errors||[]));
            return j.result?.[0]?.results||[];
          }
          const tables=['bookings','properties','clients','tenancies','workOrders','auditEvents','systemMetadata'];
          const counts={};
          for(const t of tables){
            const rows=await query('SELECT COUNT(*) AS n FROM "'+t+'"');
            counts[t]=Number(rows[0]?.n||0);
          }
          const rows=await query('SELECT data FROM bookings WHERE id=?',['EGk2n4PbRzCm9INv1Eh5']);
          if(rows.length!==1)throw new Error('Conflicting booking is no longer present exactly once.');
          const data=JSON.parse(rows[0].data);
          const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v;
          const sha=crypto.createHash('sha256').update(JSON.stringify(canonical(data))).digest('hex');
          const metadata={
            sha256:sha,
            topLevelKeys:Object.keys(data).sort(),
            status:typeof data.status==='string'?data.status:null,
            createdAt:typeof data.createdAt==='string'?data.createdAt:null,
            updatedAt:typeof data.updatedAt==='string'?data.updatedAt:null,
            hasPropertyId:Boolean(data.propertyId),
            hasServiceId:Boolean(data.serviceId),
            hasAppointment:Boolean(data.appointment),
            hasClientId:Boolean(data.clientId||data.primaryClientId),
          };
          console.log(JSON.stringify({counts,conflict:metadata},null,2));
          NODE
